spring.application.name=greeting-service
server.port=8080

greeting-service.greeting=Ola
greeting-service.default-name=Mundo

spring.profiles.active=it

#sempre cuidar ao exibir isso, informação SENSIVEL, usado assim só pra fins didáticos
management.endpoint.env.show-values=always

spring.config.import=optional:configserver:http://localhost:8888/
#optional pois vai rodar a aplicação mesmo que o server esteja off

#SelfRegistrationPattern
eureka.client.service-url.default-zone=http://localhost:8761/eureka

#Ideal para ambiente conteinerzado
eureka.instance.prefer-ip-address=true
#Indicar que o Service Register deve validar a saúde do serviço através do actuator e n só hearthbeat(opcional - default true)
eureka.client.healthcheck.enabled=true
#Personaliza o ip
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,circuit-breakers,circuit-breaker-events
management.endpoint.health.show-details=always
#Exibir informações no /actuator/info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Microservice Java 2026
info.app.autor=João Gabriel Winck Mendes
#Pesonalização de Metadata para o Eureka Service Registery
eureka.instance.metadata-map.github.repo=JoaoGabrielWMendes/microservices-java