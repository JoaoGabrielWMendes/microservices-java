spring.application.name=currency-service
server.port=8100

spring.datasource.url=jdbc:postgresql://localhost:5432/db_currency
spring.datasource.username=postgres
spring.datasource.password=teste

#Já tem o banco, ent n precisa criar
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true

spring.flyway.locations=classpath:db_migration

#SelfRegistrationPattern
eureka.client.service-url.default-zone=http://localhost:8761/eureka

#Ideal para ambiente conteinerzado
eureka.instance.prefer-ip-address=true
#Indicar que o Service Register deve validar a saúde do serviço através do actuator e n só hearthbeat(opcional - default true)
eureka.client.healthcheck.enabled=true
#Personaliza o ip
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,circuit-breakers,circuit-breaker-events
management.endpoint.health.show-details=always
#Exibir informações no /actuator/info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Microservice Java 2026
info.app.autor=João Gabriel Winck Mendes
#Pesonalização de Metadata para o Eureka Service Registery
eureka.instance.metadata-map.github.repo=JoaoGabrielWMendes/microservices-java

spring.cloud.openfeign.client.config.bcb-api.connect-timeout=1000
spring.cloud.openfeign.client.config.bcb-api.read-timeout=3000

resilience4j.retry.instances.bcb-api.max-attempts=3
resilience4j.retry.instances.bcb-api.wait-duration=500ms
resilience4j.retry.instances.bcb-api.enable-exponential-backoff=true
resilience4j.retry.instances.bcb-api.exponential-backoff-multiplier=2.0
resilience4j.retry.instances.bcb-api.enable-randomized-wait=true
resilience4j.retry.instances.bcb-api.randomized-wait-factor=0.5

resilience4j.retry.instances.bcb-api.ignore-exceptions[0]=feign.FeignException\$FeignClientException

resilience4j.retry.instances.bcb-api.retry-exceptions[0]=feign.RetryableException
resilience4j.retry.instances.bcb-api.retry-exceptions[1]=java.net.SocketTimeoutException
resilience4j.retry.instances.bcb-api.retry-exceptions[2]=feign.FeignException\$FeignServerException

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=15s

spring.cloud.openfeign.circuitbreaker.enabled=true

resilience4j.circuitbreaker.instances.BCBClientgetPriceStringStringString.register-health-indicator=true
resilience4j.circuitbreaker.instances.BCBClientgetPriceStringStringString.sliding-window-size=10
resilience4j.circuitbreaker.instances.BCBClientgetPriceStringStringString.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.BCBClientgetPriceStringStringString.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.BCBClientgetPriceStringStringString.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.BCBClientgetPriceStringStringString.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.BCBClientgetPriceStringStringString.automatic-transition-from-open-to-half-open-enabled=true

management.health.circuitbreakers.enabled=true

spring.cloud.openfeign.circuitbreaker.group.enabled=true