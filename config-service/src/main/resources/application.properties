spring.application.name=config-service
server.port=8888

#spring.profiles.active=native
#isso é local
#spring.cloud.config.server.native.search-locations=classpath:/configs/{application}

spring.cloud.config.server.git.uri=https://github.com/JoaoGabrielWMendes/microservices-java.git
spring.cloud.config.server.git.default-label=main
#consegue buscar em outras branches
spring.cloud.config.server.git.search-paths=/configs/{application}

#spring.cloud.config.server.git.username=joao
#spring.cloud.config.server.git.password=1234
#caso precise

#SelfRegistrationPattern
eureka.client.service-url.default-zone=http://localhost:8761/eureka

#Ideal para ambiente conteinerzado
eureka.instance.prefer-ip-address=true
#Indicar que o Service Register deve validar a saúde do serviço através do actuator e n só hearthbeat(opcional - default true)
eureka.client.healthcheck.enabled=true
#Personaliza o ip
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,circuit-breakers,circuit-breaker-events
management.endpoint.health.show-details=always
#Exibir informações no /actuator/info
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Microservice Java 2026
info.app.autor=João Gabriel Winck Mendes
#Pesonalização de Metadata para o Eureka Service Registery
eureka.instance.metadata-map.github.repo=JoaoGabrielWMendes/microservices-java